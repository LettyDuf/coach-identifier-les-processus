rte`,title:`La carte à trois zooms`,question:`Où vivent les processus, et qui les identifie.`,gesteLie:null},{id:`grille`,title:`La grille type et niveau`,question:`Ce que les processus font, et où ils se rangent.`,gesteLie:`classer`},{id:`mesure`,title:`Mesurer un processus`,question:`Pourquoi on mesure, comment, et pour qui.`,gesteLie:`mesurer`}],N={votes:[{id:`onboarding-client`,label:`L'accueil d'un nouveau client, de la signature du contrat à sa première utilisation réussie`,isProcess:!0,explanation:`Une entrée (le contrat signé), une transformation qui se répète à chaque nouveau client, une sortie que quelqu'un attend (un client autonome) : c'est un processus.`},{id:`logiciel-tickets`,label:`Le logiciel de gestion des tickets`,isProcess:!1,explanation:`C'est un outil : il supporte le travail, il n'est pas le travail. Le processus existerait sans lui, avec un tableau et des post-it.`}],tests:[`Y a-t-il une entrée qui déclenche et une sortie livrée ? (le bornage)`,`Est-ce que cela se répète ? (un événement ponctuel n'est pas un processus)`,`Quelqu'un attend-il la sortie ? (pas de client, pas de processus)`],moral:`Trois tests, et la plupart des faux processus tombent : les outils, les rôles, les réunions, les événements. Un processus non documenté existe quand même ; un beau document sans transformation répétable n'en fait pas un.`,versAtelier:`Maintenant, allez le vivre : dans l'atelier, le geste Repérer vous fait chasser les vrais processus dans le récit d'un groupe de travail.`},Ct={ancrage:`Un indicateur appartient à une famille selon qui le lit et à quelle cadence. Trois familles d'indicateurs suffisent à piloter un processus : le comportement (KBI), la performance (KPI), le résultat (KGI).`,situations:[{id:`kgi-seul`,kind:`kgi`,context:`Imaginez : le tableau de bord d'une équipe n'affiche qu'une seule aiguille, la note de satisfaction des clients. Ce trimestre, elle chute.`,question:`Lundi matin, que peut décider l'équipe avec cette seule information ?`,options:[{id:`travailler-plus`,label:`Travailler plus dur`,correct:!1,feedback:`Plus dur sur quoi ? La note ne dit pas où ça coince : elle constate, elle ne guide pas.`},{id:`rien-decider`,label:`Pas grand-chose : elle sait que ça va mal, pas pourquoi ni quoi changer`,correct:!0,feedback:`Voilà l'angle mort du résultat seul : il arrive tard et ne désigne aucun levier. Il faut des indicateurs plus proches du travail quotidien.`},{id:`audit`,label:`Commander un audit externe`,correct:!1,feedback:`Coûteux et lent, pour découvrir ce qu'un bon tableau de bord aurait montré : le problème est de ne regarder que la fin de l'histoire.`}],lesson:`Le KGI répond à « est-ce que ça vaut le coup ? ». Indispensable, mais seul, il constate sans guider.`},{id:`kbi-seul`,kind:`kbi`,context:`Deuxième essai : le tableau de bord ne suit plus que les pratiques de l'équipe. Limite de travaux en cours respectée, relectures faites : tous les voyants sont verts.`,question:`Que sait l'équipe de l'effet de ses efforts ?`,options:[{id:`rien-effet`,label:`Rien : elle sait qu'elle fait bien, pas si ça produit quelque chose`,correct:!0,feedback:`L'angle mort du comportement seul : on peut appliquer toutes les bonnes pratiques et ne rien améliorer. Il faut aussi lire la sortie du processus.`},{id:`tout-va-bien`,label:`Tout va bien, puisque les pratiques sont bonnes`,correct:!1,feedback:`C'est le piège du moyen pris pour le but : des pratiques parfaites peuvent coexister avec des clients qui attendent six semaines.`},{id:`clients-contents`,label:`Les clients sont forcément satisfaits`,correct:!1,feedback:`Rien ne le garantit : entre le comportement de l'équipe et le client, il y a tout le processus.`}],lesson:`Le KBI répond à « que faire dès demain ? ». C'est le levier, mais seul, il tourne à vide.`},{id:`kpi-seul`,kind:`kpi`,context:`Troisième essai : le tableau de bord ne suit plus que le temps de traversée des demandes. Il s'améliore chaque mois.`,question:`L'équipe peut-elle ouvrir le champagne ?`,options:[{id:`pas-encore`,label:`Pas encore : plus vite, oui, mais personne ne vérifie le but`,correct:!0,feedback:`L'angle mort de la performance seule : on peut livrer très vite des choses qui ne règlent pas les vrais problèmes. Le résultat doit rester en vue.`},{id:`champagne`,label:`Oui : le flux s'améliore, c'est gagné`,correct:!1,feedback:`Livrer plus vite des choses qui ne servent pas le client n'a jamais sauvé un produit : la vitesse n'est pas le but.`},{id:`accelerer`,label:`Non : il faut encore accélérer`,correct:!1,feedback:`Accélérer sans but, c'est la roue du hamster : la question n'est pas d'aller plus vite, mais de savoir vers quoi.`}],lesson:`Le KPI répond à « le processus s'améliore-t-il ? ». Précieux, mais seul, il optimise à l'aveugle.`}],complement:`Les trois familles d'indicateurs se complètent comme le levier, l'effet et le but : le KBI donne quoi faire, le KPI dit si le processus y répond, le KGI vérifie que ça valait le coup. Retirez-en une, et le pilotage devient aveugle d'un œil.`,users:[{kind:`kbi`,who:`Le groupe de travail lui-même`,cadence:`Chaque jour`,usage:`S'observer au quotidien et ajuster ses pratiques sans attendre personne.`},{kind:`kpi`,who:`Le groupe de travail et son responsable`,cadence:`À chaque point d'avancement régulier`,usage:`Vérifier que le flux s'améliore et repérer où ça coince.`},{kind:`kgi`,who:`Le responsable et la direction`,cadence:`Chaque trimestre`,usage:`Vérifier que le but est atteint et arbitrer les priorités.`}],families:[{kind:`kbi`,definition:`Un KBI (indicateur de comportement) observe ce que fait le groupe de travail, pas ce qu'il obtient. C'est le levier du quotidien.`,question:`Le test : peut-on le décider dès demain matin, sans attendre personne ?`,items:[{id:`kbi-oui-wip`,label:`Respecter une limite de travaux en cours`,isKind:!0,explanation:`On peut le décider demain matin : c'est un comportement sous contrôle direct. Un KBI.`},{id:`kbi-oui-relecture`,label:`Faire relire chaque livraison par un pair`,isKind:!0,explanation:`Une pratique qu'on choisit d'appliquer ou non : un comportement, donc un KBI.`},{id:`kbi-non-traversee`,label:`Le temps de traversée d'une demande`,isKind:!1,explanation:`On ne peut pas le décider directement : on l'influence par ses comportements. C'est une performance du processus, un KPI.`},{id:`kbi-non-satisfaction`,label:`La note de satisfaction des clients`,isKind:!1,explanation:`Personne ne peut la décider demain matin : elle résulte de tout le reste. C'est un résultat, un KGI.`}]},{kind:`kpi`,definition:`Un KPI (indicateur de performance) mesure ce que le processus produit : vitesse, débit, qualité. On l'observe, on ne le décide pas.`,question:`Le test : est-ce que ça se lit à la sortie du processus ?`,items:[{id:`kpi-oui-debit`,label:`Le nombre de demandes livrées par semaine`,isKind:!0,explanation:`Se lit à la sortie du processus, semaine après semaine : une performance, un KPI (et une métrique de flux).`},{id:`kpi-oui-reprise`,label:`Le taux de demandes rouvertes après livraison`,isKind:!0,explanation:`La qualité de ce qui sort du processus : une performance, un KPI.`},{id:`kpi-non-daily`,label:`Tenir le point d'équipe chaque matin`,isKind:!1,explanation:`C'est un comportement que le groupe de travail décide : un KBI, pas une performance.`},{id:`kpi-non-renouvellement`,label:`Le renouvellement du contrat par le client`,isKind:!1,explanation:`Ça arrive bien après la sortie du processus et ça dépend de tout le parcours : un résultat, un KGI.`}]},{kind:`kgi`,definition:`Un KGI (indicateur de résultat) mesure si le but est atteint, chez le client ou pour l'organisation. Il arrive en dernier, et on ne l'influence qu'à travers les KBI et les KPI.`,question:`Le test : est-ce la raison pour laquelle le processus existe ?`,items:[{id:`kgi-oui-satisfaction`,label:`La note de satisfaction du client après résolution`,isKind:!0,explanation:`C'est pour cela que le processus existe : le client servi. Un KGI.`},{id:`kgi-oui-renouvellement`,labe esteuse.`},{icon:`bulle`,text:`Chaque matin à 9h15, l'équipe se retrouve pour son daily devant le tableau Jira.`},{icon:`demande`,text:`Un client signale un problème : sa demande arrive au support, est qualifiée, priorisée, corrigée, testée puis livrée. Quatre jours parfois, six semaines souvent.`},{icon:`entonnoir`,text:`Le PO transforme les idées brutes en tickets prêts à développer, avec l'aide de la testeuse.`},{icon:`balance`,text:`Tous les trimestres, il arbitre les priorités communes et les dépendances avec les deux autres équipes du produit.`},{icon:`courbe`,text:`En janvier, un pic de tickets a mis tout le monde sous l'eau.`},{icon:`spirale`,text:`À chaque rétrospective, l'équipe choisit une amélioration, la tente, et vérifie au sprint suivant si elle a porté.`},{icon:`porte`,text:`Le mois dernier, une nouvelle développeuse est arrivée : sept semaines entre la signature de son contrat et son premier correctif livré en autonomie.`}],candidates:[{id:`traitement-demande`,shortLabel:`Les demandes client`,icon:`demande`,isProcess:!0,explanation:`Une entrée (la demande), une transformation répétée (qualifier, prioriser, corriger, tester), une sortie livrée à un client : c'est un processus.`,identity:{entree:`Un problème signalé par un client`,sortie:`Un correctif livré`,client:`Le client qui a signalé`},classification:{type:`operationnel`,level:`equipe`,typeRationale:`Ce flux produit directement ce que le client attend : son correctif livré.`,levelRationale:`Il se déroule entièrement à l'intérieur de l'équipe Colibri, de la demande à la livraison.`,typeTraps:{support:`Piège du mot : la demande arrive au guichet « support », mais ce mot désigne une équipe, pas le type de processus. Ce flux produit directement ce que le client attend.`}}},{id:`affinage-backlog`,shortLabel:`L'affinage du backlog`,icon:`entonnoir`,isProcess:!0,explanation:`Répétable, avec une entrée (l'idée brute), une sortie (le ticket prêt) et un client (l'équipe qui développe) : c'est un processus.`,identity:{entree:`Une idée brute`,sortie:`Un ticket prêt à développer`,client:`L'équipe qui développe`},classification:{type:`operationnel`,level:`equipe`,typeRationale:`Sa sortie, le ticket prêt, alimente directement ce que le client recevra.`,levelRationale:`Il vit dans l'équipe : le PO et la testeuse en font partie.`,typeTraps:{pilotage:`Le PO décide, c'est vrai. Mais on classe un processus par ce qu'il produit, pas par qui le fait : sa sortie alimente directement ce que le client recevra.`}}},{id:`amelioration-continue`,shortLabel:`L'amélioration continue`,icon:`spirale`,isProcess:!0,explanation:`Un cycle répétable, avec une sortie vérifiable (l'amélioration qui a porté ou non) : c'est un processus, même sans outil dédié.`,identity:{entree:`Un constat en rétrospective`,sortie:`Une amélioration tentée et vérifiée`,client:`L'équipe elle-même`},classification:{type:`pilotage`,level:`equipe`,typeRationale:`Il oriente la façon de travailler de l'équipe : c'est du pilotage.`,levelRationale:`La boucle se joue dans l'équipe, de la rétrospective au sprint suivant.`,typeTraps:{support:`Il ne fournit pas de moyens aux autres processus : il oriente la façon de travailler, c'est du pilotage.`}}},{id:`integration-equipiere`,shortLabel:`L'arrivée d'une équipière`,icon:`porte`,isProcess:!0,explanation:`Une transformation répétable (chaque arrivée), bornée, avec une sortie claire (une personne autonome) : c'est un processus.`,identity:{entree:`Un contrat signé`,sortie:`Une équipière autonome`,client:`L'équipe qui l'accueille`},classification:{type:`support`,level:`equipe`,typeRationale:`Il fournit un moyen essentiel aux autres processus : une équipière autonome. Le client final n'en reçoit rien directement.`,levelRationale:`C'est l'équipe qui accueille, accompagne et rend autonome sa nouvelle équipière.`,typeTraps:{operationnel:`Le client final ne reçoit rien directement de ce processus : il fournit des moyens à l'équipe, c'est du support.`}}},{id:`arbitrage-priorites`,shortLabel:`L'arbitrage trimestriel`,icon:`balance`,isProcess:!0,explanation:`Répétable chaque trimestre, une entrée (les demandes concurrentes), une sortie (des priorités arbitrées) : c'est un processus.`,identity:{entree:`Les demandes concurrentes des trois équipes`,sortie:`Des priorités arbitrées`,client:`Les trois équipes du produit`},classification:{type:`pilotage`,level:`programme`,typeRationale:`Il décide des priorités communes : il oriente le travail, il ne produit pas directement pour le client.`,levelRationale:`Il implique les trois équipes du produit : il vit au niveau programme.`,levelTraps:{equipe:`Le PO de Colibri y participe, mais la décision engage les trois équipes du produit : c'est un processus de niveau programme.`}}},{id:`daily`,shortLabel:`Le daily de 9h15`,icon:`bulle`,isProcess:!1,nature:`Cérémonie`,explanation:`C'est une activité de pilotage à l'intérieur de processus plus larges : elle ne transforme pas une entrée en sortie livrée à un client.`},{id:`jira`,shortLabel:`Jira`,icon:`tableau`,isProcess:!1,nature:`Outil`,explanation:`C'est l'outil qui supporte le travail, pas le travail lui-même. Le processus existerait sans lui.`},{id:`testeuse`,shortLabel:`La testeuse`,icon:`loupe`,isProcess:!1,nature:`Rôle`,explanation:`C'est un rôle. Un rôle participe à des processus, il n'en est pas un.`},{id:`pic-janvier`,shortLabel:`Le pic de janvier`,icon:`courbe`,isProcess:!1,nature:`Événement ponctuel`,explanation:`C'est un événement ponctuel, pas une transformation répétable. Il peut révéler un processus sous tension, il n'en est pas un.`}],spottingFeedbacks:{success:`Les cinq processus sont repérés et aucun leurre n'est coché. Une entrée, une transformation répétée, une sortie attendue par quelqu'un : le réflexe est en place.`,missed:`Aucun leurre coché, mais il reste des processus non repérés. Certains n'ont ni réunion ni outil dédié, et existent quand même.`,falsePositive:`Tous les processus sont repérés, mais au moins un leurre s'est glissé dans la sélection. Pour chaque carte, trois tests : une entrée ? une transformation répétée ? une sortie livrée à quelqu'un ?`,mixed:`Des processus manquent encore, et au moins un leurre est coché. Les trois tests aident : une entrée ? est-ce que ça se répète ? quelqu'un attend-il la sortie ?`},measure:{processLabel:`le traitement d'une demande client`,chainExample:`Si l'équipe respecte sa limite de travaux en cours, alors les demandes traversent plus vite, et le client est servi plus tôt.`,maxChainBlocks:4,blocks:[{id:`kbi-wip`,label:`Respect de la limite de travaux en cours`,kind:`kbi`,timing:`leading`,explanation:`Un comportement que l'équipe contrôle chaque jour, et qui influence le temps de traversée : un vrai KBI.`},{id:`kbi-relecture`,label:`Chaque correctif est relu par un pair avant fusion`,kind:`kbi`,timing:`leading`,explanation:`Comportement contrôlable qui influence la qualité en aval : un vrai KBI.`},{id:`kpi-traversee`,label:`Temps de traversée d'une demande, de la prise en charge à la livraison`,kind:`kpi`,timing:`lagging`,isFlowMetric:!0,explanation:`Mesure la performance du processus lui-même : un KPI, et une métrique de flux.`},{id:`kpi-debit`,label:`Débit : demandes livrées par semaine`,kind:`kpi`,timing:`lagging`,isFlowMetric:!0,explanation:`Mesure ce que le processus produit réellement : un KPI, et une métrique de flux.`},{id:`kpi-reprise`,label:`Taux de demandes rouvertes après livraison`,kind:`kpi`,timing:`lagging`,explanation:`Mesure la qualité de sortie du processus : un KPI.`},{id:`kgi-satisfaction`,label:`Note de satisfaction du client après résolution`,kind:`kgi`,timing:`lagging`,explanation:`Le résultat visé : le client servi. On ne l'influence qu'à travers les KBI et les KPI.`},{id:`piege-occupation`,label:`Taux d'occupation des développeurs`,kind:`piege`,explanation:`On mesurerait les gens, pas le flux. Une équipe occupée à 100 % livre souvent plus lentement.`},{id:`piege-velocite`,label:`Vélocité comparée aux autres équipes`,kind:`piege`,explanation:`La vélocité ne se compare jamais entre équipes ; utilisée ainsi, elle juge les personnes.`},{id:`piege-lignes`,label:`Nombre de lignes de code produites`,kind:`piege`,explanation:`Mesure l'activité, pas la valeur. Plus de lignes n'est pas mieux.`}],chainFeedbacks:{success:`La chaîne tient : un comportement contrôlable en amont, la performance du processus au milieu, le résultat client au bout. Le fluide circule.`,violations:{empty:`Aucun bloc sélectionné. Une chaîne de mesure commence par choisir quoi observer.`,"trap-included":`Un bloc piège s'est glissé dans la chaîne : il mesure les personnes ou l'activité, pas le flux. Retirez-le : c'est la première règle de la mesure.`,"too-many":`Trop de cadrans : un tableau de bord qui mesure tout ne pilote rien. Gardez l'essentiel : un comportement, une ou deux performances, un résultat.`,"no-kgi":`Aucun résultat visé dans la chaîne. Sans KGI, on mesure le processus dans le vide : pour qui fait-on tout ça ?`,"multiple-kgi":`Plusieurs résultats visés à la fois : la chaîne perd son cap. Un dispositif se construit autour d'un seul KGI.`,"missing-kpi":`Rien ne mesure la performance du processus lui-même. Sans KPI, impossible de savoir si le flux s'améliore.`,"missing-kbi":`Aucun comportement sous contrôle de l'équipe. Sans KBI, la chaîne constate mais ne donne aucun levier pour agir.`,"missing-leading":`Tous les indicateurs regardent en arrière. Sans indicateur avancé (leading), on pilote dans le rétroviseur.`,"missing-lagging":`Aucun indicateur de résultat. Sans lagging, on suit l'effort sans jamais vérifier qu'il produit quelque chose.`}},validExample:[`kbi-wip`,`kpi-traversee`,`kgi-satisfaction`],quiz:[{id:`lire-percentile`,palier:1,question:`Le temps de traversée des demandes de Colibri : moyenne 6 jours, 85e percentile 18 jours. Que peut-on promettre à un client qui signale un problème ?`,options:[{id:`six-jours`,label:`Environ 6 jours, c'est la moyenne`,correct:!1,feedback:`La moyenne cache les cas longs : presque une demande sur cinq dépasse 18 jours. Promettre 6 jours, c'est décevoir souvent.`},{id:`dix-huit-jours`,label:`Moins de 18 jours dans environ 85 % des cas`,correct:!0,feedback:`C'est la lecture en percentiles : une promesse honnête, tenue la plupart du temps, fondée sur les données réelles.`},{id:`impossible`,label:`Rien, chaque demande est unique`,correct:!1,feedback:`Chaque demande est unique, mais leur ensemble a un comportement prévisible : c'est tout l'intérêt des percentiles.`}]},{id:`lire-wip`,palier:1,question:`Le débit de Colibri est stable à 8 demandes livrées par semaine, mais le nombre de demandes en cours a doublé. Qu'est-ce que cela annonce ?`,options:[{id:`temps-allonge`,label:`Les temps de traversée vont s'allonger`,correct:!0,feedback:`Même débit, deux fois plus de travaux en cours : chaque demande attendra plus longtemps. C'est mécanique (la loi de Little).`},{id:`equipe-productive`,label:`L'équipe est plus productive, elle absorbe plus`,correct:!1,feedback:`Elle absorbe plus en parallèle, mais livre au même rythme : rien n'est produit plus vite, tout attend plus longtemps.`},{id:`rien`,label:`Rien de particulier tant que le débit tient`,correct:!1,feedback:`Le débit tient, mais l'attente gonfle en silence : c'est justement le signal avancé qu'il faut savoir lire.`}]},{id:`choisir-direction`,palier:2,question:`La direction veut savoir si les clients sont remis en marche plus vite qu'avant. Quelle mesure répond à sa question ?`,options:[{id:`traversee`,label:`Le temps de traversée d'une demande, en tendance`,correct:!0,feedback:`C'est la question posée : le flux vu du client, de la prise en charge à la livraison, suivi dans le temps.`},{id:`occupation`,label:`Le taux d'occupation des développeurs`,correct:!1,feedback:`Piège classique : l'occupation mesure les gens, pas le service rendu. Une équipe saturée livre souvent plus lentement.`},{id:`velocite`,label:`La vélocité de l'équipe comparée au trimestre dernier`,correct:!1,feedback:`La vélocité est un outil interne de planification : elle ne dit rien du délai vécu par le client.`}]},{id:`choisir-equipe`,palier:2,question:`L'équipe veut un signal avancé, qu'elle contrôle elle-même, pour améliorer son flux. Que choisir ?`,options:[{id:`respect-wip`,label:`Le respect de sa limite de travaux en cours`,correct:!0,feedback:`Un comportement observable chaque jour, sous le contrôle de l'équipe, qui influence le temps de traversée : un KBI.`},{id:`satisfaction`,label:`La note de satisfaction des clients`,correct:!1,feedback:`Essentielle, mais elle arrive tard et dépend de bien d'autres choses : c'est un KGI, pas un signal avancé contrôlable.`},{id:`lignes`,label:`Le nombre de lignes de code produites`,correct:!1,feedback:`Mesure l'activité, pas la valeur : plus de lignes n'est pas mieux.`}]}]},classificationFeedbacks:{success:`Les cinq processus sont à leur place sur les deux axes, du premier coup. La grille est en place : ce que ça produit d'abord, où ça vit ensuite.`,miss:`Le classement est terminé, avec des hésitations en route. En rejouant, reposez chaque fois la même question : qu'est-ce que ça produit, et pour qui ?`},signature:{trapPattern:`outil-ceremonie-role-evenement`,theme:`editeur-logiciel-veterinaire`}},Bt={id:`harfang`,group:`equipe-agile`,title:`L'équipe Harfang`,narrative:[{icon:`equipe`,text:`L'équipe Harfang, huit personnes, fait vivre les outils de fondation d'une grande organisation : Fluxo le moteur de processus, Sésame la gestion des accès, Rouage les robots logiciels, Balise l'adoption numérique, Lanterne le minage de processus. Un PM, un architecte de plateforme, deux architectes intégrateurs, quatre développeurs. Douze équipes de livraison s'appuient sur ces outils.`},{icon:`demande`,text:`Quand une équipe de livraison demande un service (un accès dans Sésame, un nouveau workflow Fluxo, un robot Rouage), la demande arrive au guichet, est qualifiée par un architecte intégrateur, réalisée, testée puis livrée. Deux jours parfois, cinq semaines souvent.`},{icon:`engrenage`,text:`Chaque jeudi, les mises à jour des outils partent en production : tests, revue à deux, déploiement en heures creuses.`},{icon:`spirale`,text:`Une fois par mois, l'architecte de plateforme arbitre les choix structurants au comité d'architecture, avec ses homologues des autres domaines.`},{icon:`porte`,text:`Un nouvel architecte intégrateur est arrivé le mois dernier : entre sa signature et sa première intégration livrée seul, huit semaines.`},{icon:`tableau`,text:`Le dossier d'architecture de référence, sur le wiki, vient d'être remis à jour. Au mur, l'objectif du trimestre : réduire de moitié le délai de livraison des demandes. En bas du tableau : la disponibilité des outils de fondation, 99,7 %.`},{icon:`reseau`,text:`Quand un incident touche plusieurs équipes de livraison, une cellule se monte : diagnostic conjoint, correctif, bilan partagé entre les équipes concernées.`}],candidates:[{id:`demandes-acces`,shortLabel:`Les demandes de service`,icon:`demande`,isProcess:!0,explanation:`Une entrée (la demande : accès, workflow, robot), une transformation répétée (qualifier, réaliser, tester, livrer), une sortie attendue par un client interne : c'est un processus, le même quel que soit l'outil traversé.`,identity:{entree:`Une demande d'une équipe de livraison (accès, workflow, robot)`,sortie:`Le service livré et testé`,client:`L'équipe de livraison demandeuse`},classification:{type:`operationnel`,level:`equipe`,typeRationale:`Il livre directement ce que le client d'Harfang attend : son service. Le client est interne, mais c'est bien l'opérationnel de l'équipe.`,levelRationale:`Harfang le mène seule, du guichet à la livraison.`,typeTraps:{support:`Vu de l'entreprise, une équipe de fondations rend service ; mais le type se juge du point de vue du processus et de son client direct : ce flux livre directement la valeur d'Harfang à son client. C'est son opérationnel.`}}},{id:`mises-en-production`,shortLabel:`Les mises à jour des outils`,icon:`engrenage`,isProcess:!0,explanation:`Une entrée (les évolutions prêtes), une transformation répétée chaque semaine (tester, relire, déployer), une sortie en service : c'est un processus, unique même si les outils sont multiples.`,identity:{entree:`Les évolutions prêtes de la semaine, tous outils confondus`,sortie:`Des outils de fondation à jour en production`,client:`Les équipes de livraison utilisatrices`},classification:{type:`operationnel`,level:`equipe`,typeRationale:`Il livre les outils eux-mêmes, ce que les clients internes utilisent.`,levelRationale:`Il se joue entièrement dans l'équipe, des tests au déploiement.`}},{id:`arbitrage-architecture`,shortLabel:`L'arbitrage d'architecture`,icon:`spirale`,isProcess:!0,explanation:`Répétable chaque mois, une entrée (les choix structurants en attente), une sortie (des décisions d'architecture) : c'est un processus.`,identity:{entree:`Les choix structurants en attente`,sortie:`Des décisions d'architecture arbitrées`,client:`Les domaines et équipes concernés`},classification:{type:`pilotage`,level:`programme`,typeRationale:`Il décide comment on construira : il oriente, il ne livre rien directement aux utilisateurs.`,levelRationale:`Il réunit les architectes de plusieurs domaines : il traverse les équipes, il vit au niveau programme.`,levelTraps:{equipe:`L'architecte de plateforme y siège, mais la décision engage plusieurs domaines : c'est un processus de niveau programme.`}}},{id:`integration-architecte`,shortLabel:`L'intégration d'un nouvel architecte`,icon:`porte`,isProcess:!0,explanation:`Une transformation répétable à chaque arrivée, bornée (de la signature à l'autonomie), avec une sortie claire : c'est un processus.`,identity:{entree:`Un contrat signé`,sortie:`Un architecte intégrateur autonome`,client:`L'équipe qui l'accueille`},classification:{type:`support`,level:`equipe`,typeRationale:`Il fournit un moyen aux autres processus : une personne autonome. Les clients de la plateforme n'en voient rien directement.`,levelRationale:`C'est l'équipe qui accueille, accompagne et rend autonome.`,typeTraps:{operationnel:`Le client de la plateforme ne reçoit rien directement de ce processus : il fournit des moyens à l'équipe, c'est du support.`}}},{id:`cellule-incident`,shortLabel:`La cellule d'incident multi-équipes`,icon:`reseau`,isProcess:!0,explanation:`Répétable (à chaque incident majeur), une entrée (l'incident), une sortie (le service rétabli et le bilan partagé) : c'est un processus.`,identity:{entree:`Un incident d'un outil de fondation touchant plusieurs équipes`,sortie:`Le service rétabli, un bilan partagé`,client:`Les équipes de livraison touchées`},classification:{type:`operationnel`,level:`programme`,typeRationale:`Il remet en marche ce que les clients utilisent : c'est de l'opérationnel, même en mode exceptionnel.`,levelRationale:`Le diagnostic et le bilan traversent les équipes touchées : il vit au niveau programme.`,levelTraps:{equipe:`Harfang pilote la cellule, mais le diagnostic et le bilan impliquent toutes les équipes touchées : niveau programme.`}}},{id:`dossier-architecture`,shortLabel:`Le dossier d'architecture de référence`,icon:`tableau`,isProcess:!1,nature:`Document`,explanation:`C'est la description d'une cible, pas une transformation. Un processus non documenté existe ; un document sans transformation répétable n'est pas un processus.`},{id:`objectif-delai`,shortLabel:`L'objectif : délai de livraison réduit de moitié`,icon:`fanion`,isProcess:!1,nature:`Objectif`,explanation:`C'est une destination, pas un chemin : il dit où aller, il ne transforme aucune entrée en sortie. Les processus servent l'objectif, ils ne se confondent pas avec lui.`},{id:`direction-infrastructures`,shortLabel:`La direction des infrastructures`,icon:`equipe`,isProcess:!1,nature:`Département`,explanation:`C'est une case de l'organigramme. Un département héberge et traverse des processus, il n'en est pas un.`},{id:`disponibilite`,shortLabel:`La disponibilité des outils : 99,7 %`,icon:`courbe`,isProcess:!1,nature:`Indicateur`,explanation:`C'est une mesure : elle observe le résultat de processus, elle ne transforme rien. Un indicateur sans processus dessous n'est qu'un chiffre au mur.`}],spottingFeedbacks:{success:`Les cinq processus sont repérés et aucun leurre n'est coché. Ni le dossier, ni l'objectif, ni le département, ni l'indicateur ne vous ont piégé : le réflexe se renforce.`,missed:`Aucun leurre coché, mais il reste des processus non repérés. Certains tiennent dans une seule phrase du récit : cherchez les transformations répétées.`,falsePositive:`Tous les processus sont repérés, mais au moins un leurre s'est glissé dans la sélection. Un document, un objectif, un département ou un indicateur ne transforme rien : appliquez les trois tests.`,mixed:`Des processus manquent, et au moins un leurre est coché. Les trois tests aident : une entrée ? est-ce que ça se répète ? quelqu'un attend-il la sortie ?`},classificationFeedbacks:{success:`Les cinq processus sont à leur place sur les deux axes, du premier coup. La grille tient, même quand l'opérationnel vit au niveau programme.`,miss:`Le classement est terminé, avec des hésitations. Rejouez en posant chaque fois la même question : qu'est-ce que ça produit, et pour qui ?`},measure:{processLabel:`le traitement d'une demande de service`,chainExample:`Si chaque demande est qualifiée sous 48 heures par un architecte intégrateur, alors les demandes se livrent plus vite, et les équipes de livraison démarrent leurs projets à la date prévue.`,maxChainBlocks:4,blocks:[{id:`kbi-qualification`,label:`Chaque demande est qualifiée sous 48 h par un architecte intégrateur`,kind:`kbi`,timing:`leading`,explanation:`Un comportement que l'équipe contrôle à chaque demande, et qui débloque tout l'aval : un KBI.`},{id:`kbi-gabarit`,label:`Les demandes standard passent par le gabarit en libre-service`,kind:`kbi`,timing:`leading`,explanation:`Une pratique que l'équipe et ses clients choisissent d'appliquer : un comportement, donc un KBI.`},{id:`kpi-delai`,label:`Délai de livraison d'une demande, de la demande à la livraison`,kind:`kpi`,timing:`lagging`,isFlowMetric:!0,explanation:`Mesure la performance du processus lui-même : un KPI, et une métrique de flux.`},{id:`kpi-debit`,label:`Demandes livrées par mois`,kind:`kpi`,timing:`lagging`,isFlowMetric:!0,explanation:`Le débit du processus : un KPI, et une métrique de flux.`},{id:`kpi-reprise`,label:`Taux de demandes à reprendre après livraison`,kind:`kpi`,timing:`lagging`,explanation:`La qualité de sortie du processus : un KPI.`},{id:`kgi-demarrage`,label:`Part des projets des équipes de livraison qui démarrent à la date prévue`,kind:`kgi`,timing:`lagging`,explanation:`Le résultat visé : des équipes clientes qui démarrent sans attendre. On ne l'influence qu'à travers les KBI et les KPI.`},{id:`piege-occupation`,label:`Taux d'occupation des architectes intégrateurs`,kind:`piege`,explanation:`On mesurerait les personnes, pas le flux. Des architectes saturés ouvrent des accès plus lentement.`},{id:`piege-comparaison`,label:`Nombre de demandes traitées, comparé entre architectes`,kind:`piege`,explanation:`Les demandes n'ont pas la même taille : cette comparaison juge les personnes au lieu d'éclairer le processus.`},{id:`piege-heures`,label:`Heures supplémentaires de l'équipe`,kind:`piege`,explanation:`Mesure l'effort, pas le résultat, et récompense l'épuisement : exactement ce qu'un bon dispositif évite.`}],chainFeedbacks:{success:`La chaîne tient : une qualification rapide en amont, la performance du flux d'accès au milieu, des projets qui démarrent à l'heure au bout. Le fluide circule.`,violations:{empty:`Aucun bloc sélectionné. Une chaîne de mesure commence par choisir quoi observer.`,"trap-included":`Un bloc piège s'est glissé dans la chaîne : il mesure les personnes ou l'effort, pas le flux. Retirez-le : c'est la première règle de la mesure.`,"too-many":`Trop de cadrans : un tableau de bord qui mesure tout ne pilote rien. Gardez l'essentiel : un comportement, une ou deux performances, un résultat.`,"no-kgi":`Aucun résultat visé dans la chaîne. Sans KGI, on livre des demandes dans le vide : pour qui fait-on tout ça ?`,"multiple-kgi":`Plusieurs résultats visés à la fois : la chaîne perd son cap. Un dispositif se construit autour d'un seul KGI.`,"missing-kpi":`Rien ne mesure la performance du processus lui-même. Sans KPI, impossible de savoir si le flux s'améliore.`,"missing-kbi":`Aucun comportement sous contrôle de l'équipe. Sans KBI, la chaîne constate mais ne donne aucun levier pour agir.`,"missing-leading":`Tous les indicateurs regardent en arrière. Sans indicateur avancé (leading), on pilote dans le rétroviseur.`,"missing-lagging":`Aucun indicateur de résultat. Sans lagging, on suit l'effort sans jamais vérifier qu'il produit quelque chose.`}},validExample:[`kbi-qualification`,`kpi-delai`,`kgi-demarrage`],quiz:[{id:`lire-tendance`,palier:1,question:`Le taux de demandes à reprendre après livraison : 9 % en mars, 2 % en avril, 8 % en mai, 3 % en juin. Que peut-on en dire ?`,options:[{id:`instable`,label:`Il oscille : rien ne prouve une amélioration, il faut lire la tendance sur la durée`,correct:!0,feedback:`Un indicateur se lit en tendance, jamais sur un point : deux bons mois isolés ne font pas un progrès.`},{id:`juin-bon`,label:`Juin est bon, le problème est réglé`,correct:!1,feedback:`Mars et mai disaient déjà le contraire de leur mois suivant : un point isolé ne prouve rien.`},{id:`moyenne`,label:`La moyenne est de 5,5 %, c'est le chiffre à retenir`,correct:!1,feedback:`La moyenne écrase justement ce que la série montre : une instabilité, qui est l'information la plus utile ici.`}]},{id:`lire-deux-cadrans`,palier:1,question:`Le taux de reprise reste à 2 %, mais le délai de livraison d'une demande a doublé depuis deux mois. Que lire ?`,options:[{id:`signal`,label:`La qualité tient, mais quelque chose ralentit le flux : à investiguer`,correct:!0,feedback:`Deux cadrans se lisent ensemble : une qualité stable payée par un flux qui ralentit est un signal, pas une victoire.`},{id:`tout-va-bien`,label:`Tout va bien : le taux de reprise est excellent`,correct:!1,feedback:`Un seul cadran ne suffit jamais : le délai qui double annonce des files d'attente, donc des projets clients retardés.`},{id:`ralentir`,label:`Ralentir encore les ouvertures pour sécuriser davantage`,correct:!1,feedback:`C'est l'intuition inverse du flux : allonger l'attente ne fiabilise rien, elle accumule les demandes et la pression.`}]},{id:`choisir-direction`,palier:2,question:`La direction demande : « les équipes de livraison démarrent-elles leurs projets à temps ? ». Quelle mesure répond à sa question ?`,options:[{id:`demarrage`,label:`La part des projets qui démarrent à la date prévue, en tendance`,correct:!0,feedback:`C'est le résultat vécu par les clients de la plateforme : un KGI, lu en tendance. Exactement la question posée.`},{id:`debit`,label:`Le nombre de demandes livrées par mois`,correct:!1,feedback:`C'est la performance du processus, pas le résultat chez le client : livrer beaucoup ne garantit pas des projets à l'heure.`},{id:`occupation`,label:`Le taux d'occupation des architectes intégrateurs`,correct:!1,feedback:`Piège classique : l'occupation mesure les personnes, pas le service rendu. Des architectes saturés ralentissent le flux.`}]},{id:`choisir-equipe`,palier:2,question:`L'équipe veut un signal avancé, sous son contrôle, pour accélérer la livraison des demandes. Que choisir ?`,options:[{id:`qualification`,label:`Chaque demande qualifiée sous 48 h`,correct:!0,feedback:`Observable à chaque demande, décidé par l'équipe, débloque tout l'aval : un KBI.`},{id:`delai`,label:`Le délai de livraison d'une demande`,correct:!1,feedback:`Précieux, mais il constate après coup : c'est la performance qui mesure, pas le levier qui accélère.`},{id:`heures`,label:`Les heures supplémentaires de l'équipe`,correct:!1,feedback:`Mesure l'effort, pas le flux, et pousse au sur-régime : un piège.`}]}]},signature:{trapPattern:`document-objectif-departement-indicateur`,theme:`plateforme-integration-ti`}},Vt={id:`gestion-demande`,group:`programme`,title:`La gestion de la demande transverse`,narrative:[{icon:`equipe`,text:`Un gestionnaire de portefeuille, deux analystes d'affaires, un architecte de solution : quatre rôles transverses, chacun au service de plusieurs équipes de livraison, sans former eux-mêmes une équipe.`},{icon:`entonnoir`,text:`Une direction métier remonte un besoin : il est reçu, qualifié, priorisé, traduit en solution, découpé, confié à une équipe, puis vérifié en service. Trois semaines parfois, quatre mois souvent.`},{icon:`balance`,text:`Chaque trimestre, le gestionnaire de portefeuille arbitre l'ordre des demandes en attente avec les directions métier concernées.`},{icon:`pilier`,text:`L'architecte de solution tient à jour un référentiel de standards et de patrons réutilisables, à la disposition de toutes les équipes de livraison.`},{icon:`tableau`,text:`Chaque demande est suivie sur Virelo, un tableau kanban qui rend visible en temps réel le travail en cours et les priorités.`},{icon:`bulle`,text:`Chaque semaine, les quatre rôles transverses se réunissent une heure ou deux devant Virelo pour faire le point ensemble sur l'avancement et les priorités.`},{icon:`porte`,text:`Fin décembre, un gel des nouvelles demandes protège la clôture budgétaire : aucune nouvelle demande n'est acceptée pendant trois semaines.`}],candidates:[{id:`gestion-demande-transverse`,shortLabel:`La gestion de la demande`,icon:`entonnoir`,isProcess:!0,explanation:`Une entrée (le besoin brut), une transformation répétée (qualifier, prioriser, traduire, découper, confier, vérifier), une sortie mise en service : c'est un processus.`,identity:{entree:`Un besoin métier brut remonté par une direction`,sortie:`Une solution mise en service et vérifiée`,client:`La direction métier demandeuse`},classification:{type:`operationnel`,level:`programme`,typeRationale:`Sa sortie va jusqu'à la mise en service : c'est bien ce que la direction demandeuse reçoit, un vrai opérationnel.`,levelRationale:`Aucune équipe ne le mène seule de bout en bout : il traverse plusieurs équipes de livraison, il vit au niveau programme.`,typeTraps:{pilotage:`Il y a de l'analyse et de la priorisation, c'est vrai. Mais sa sortie va jusqu'à la mise en service : c'est bien ce que la direction demandeuse reçoit, un vrai opérationnel.`},levelTraps:{equipe:`Une équipe reçoit une part du travail, mais aucune ne mène seule la demande de bout en bout : elle traverse plusieurs équipes, niveau programme.`}}},{id:`arbitrage-priorites-transverse`,shortLabel:`L'arbitrage trimestriel`,icon:`balance`,isProcess:!0,explanation:`Répétable chaque trimestre, une entrée (les demandes concurrentes), une sortie (un ordre arbitré) : c'est un processus.`,identity:{entree:`Les demandes en attente de plusieurs directions métier`,sortie:`Un ordre de priorité arbitré`,client:`Les équipes qui recevront le travail`},classification:{type:`pilotage`,level:`programme`,typeRationale:`Il décide de l'ordre de traitement : il oriente le travail des équipes, il ne produit rien directement pour la direction demandeuse.`,levelRationale:`Il implique plusieurs directions métier et plusieurs équipes concurrentes : il vit au niveau programme.`,typeTraps:{operationnel:`Il produit un livrable concret, un ordre arbitré, c'est vrai. Mais ce livrable oriente le travail des équipes, il ne va pas jusqu'à la direction demandeuse : c'est du pilotage.`}}},{id:`referentiel-architecture-commun`,shortLabel:`Le référentiel commun`,icon:`pilier`,isProcess:!0,explanation:`Une entrée (un besoin de cohérence technique), une transformation continue (documenter, tenir à jour), une sortie utilisée par les équipes : c'est un processus.`,identity:{entree:`Un besoin de cohérence technique remonté par une équipe`,sortie:`Des standards et des patrons réutilisables, tenus à jour`,client:`Les équipes de livraison`},classification:{type:`support`,level:`programme`,typeRationale:`Il fournit un moyen aux équipes, des standards réutilisables : son client est interne, ce n'est pas la direction demandeuse.`,levelRationale:`Il est tenu à la disposition de toutes les équipes de livraison à la fois : il vit au niveau programme.`,typeTraps:{operationnel:`Il est utilisé au quotidien par les équipes, c'est vrai. Mais son client est interne aux équipes, pas la direction demandeuse : c'est du support.`}}},{id:`outil-virelo`,shortLabel:`Virelo`,icon:`tableau`,isProcess:!1,nature:`Outil`,explanation:`C'est l'outil qui suit les demandes, pas le travail lui-même. La gestion de la demande existerait sans lui.`},{id:`architecte-solution`,shortLabel:`L'architecte de solution`,icon:`boussole`,isProcess:!1,nature:`Rôle`,explanation:`C'est un rôle. Un rôle participe à des processus, il n'en est pas un.`},{id:`synchronisation-hebdomadaire`,shortLabel:`La synchronisation hebdomadaire`,icon:`bulle`,isProcess:!1,nature:`Cérémonie`,explanation:`C'est une activité de coordination à l'intérieur de la gestion de la demande : elle ne transforme pas elle-même une entrée en sortie livrée.`},{id:`gel-fin-annee`,shortLabel:`Le gel de fin d'année`,icon:`porte`,isProcess:!1,nature:`Événement ponctuel`,explanation:`C'est un événement ponctuel, pas une transformation répétable. Il suspend la gestion de la demande, il n'en est pas un.`}],spottingFeedbacks:{success:`Les trois processus sont repérés et aucun leurre n'est coché. Ni l'outil, ni le rôle, ni la cérémonie, ni l'événement ne vous ont piégé : le réflexe se renforce au niveau programme.`,missed:`Aucun leurre coché, mais il reste des processus non repérés. Un référentiel qui se tient à jour en continu peut se cacher dans une seule phrase du récit.`,falsePositive:`Tous les processus sont repérés, mais au moins un leurre s'est glissé dans la sélection. Un outil, un rôle, une cérémonie ou un événement ne transforme rien : appliquez les trois tests.`,mixed:`Des processus manquent, et au moins un leurre est coché. Les trois tests aident : une entrée ? est-ce que ça se répète ? quelqu'un attend-il la sortie ?`},classificationFeedbacks:{success:`Les trois processus sont à leur place sur les deux axes, du premier coup. Les trois types existent bien au niveau programme, sans qu'aucun ne suppose une équipe.`,miss:`Le classement est terminé, avec des hésitations. Rejouez en posant chaque fois la même question : qu'est-ce que ça produit, et pour qui ?`},measure:{processLabel:`la gestion de la demande transverse`,chainExample:`Si chaque demande est qualifiée avec le gabarit standard dès sa réception, alors elle se traduit plus vite en solution prête à confier à une équipe, et la direction demandeuse reçoit une solution qui répond vraiment à son besoin.`,maxChainBlocks:4,blocks:[{id:`kbi-qualification-gabarit`,label:`Chaque demande est qualifiée avec le gabarit standard dès sa réception`,kind:`kbi`,timing:`leading`,explanation:`Un comportement que les analystes contrôlent dès l'arrivée de la demande, et qui débloque tout l'aval : un KBI.`},{id:`kbi-revue-avant-confiage`,label:`Chaque demande découpée est revue avec l'équipe qui la recevra avant d'être confiée`,kind:`kbi`,timing:`leading`,explanation:`Comportement contrôlable qui influence directement la qualité de ce qui est confié : un KBI.`},{id:`kpi-delai-traduction`,label:`Délai de traduction d'une demande en solution prête à confier`,kind:`kpi`,timing:`lagging`,isFlowMetric:!0,explanation:`Mesure la performance de la gestion de la demande elle-même : un KPI, et une métrique de flux.`},{id:`kpi-attente-qualification`,label:`Nombre de demandes en attente de qualification`,kind:`kpi`,timing:`lagging`,isFlowMetric:!0,explanation:`Mesure ce qui s'accumule avant traitement, des travaux en cours : un KPI, et une métrique de flux.`},{id:`kpi-retour-clarification`,label:`Taux de demandes qui repassent en clarification après un premier découpage`,kind:`kpi`,timing:`lagging`,explanation:`Mesure la qualité de sortie du découpage : un KPI.`},{id:`kgi-part-solutions`,label:`Part des solutions livrées qui répondent au besoin métier initial, vérifiée en service`,kind:`kgi`,timing:`lagging`,explanation:`Le résultat visé : la direction demandeuse est servie. On ne l'influence qu'à travers les KBI et les KPI.`},{id:`piege-nombre-analyste`,label:`Nombre de demandes traitées par analyste`,kind:`piege`,explanation:`Mesurerait l'activité d'une personne, pas le flux des demandes.`},{id:`piege-occupation-analystes`,label:`Taux d'occupation des analystes`,kind:`piege`,explanation:`Mesurerait les gens, pas le flux.`},{id:`piege-velocite-analystes`,label:`Vélocité comparée entre analystes`,kind:`piege`,explanation:`Ne se compare jamais entre personnes ; jugerait les gens plutôt que le flux.`}],chainFeedbacks:{success:`La chaîne tient : une qualification soignée en amont, la performance de la gestion de la demande au milieu, le besoin métier servi au bout. Le fluide circule.`,violations:{empty:`Aucun bloc sélectionné. Une chaîne de mesure commence par choisir quoi observer.`,"trap-included":`Un bloc piège s'est glissé dans la chaîne : il mesure les personnes ou l'activité, pas le flux. Retirez-le : c'est la première règle de la mesure.`,"too-many":`Trop de cadrans : un tableau de bord qui mesure tout ne pilote rien. Gardez l'essentiel : un comportement, une ou deux performances, un résultat.`,"no-kgi":`Aucun résultat visé dans la chaîne. Sans KGI, on traite des demandes dans le vide : pour qui fait-on tout ça ?`,"multiple-kgi":`Plusieurs résultats visés à la fois : la chaîne perd son cap. Un dispositif se construit autour d'un seul KGI.`,"missing-kpi":`Rien ne mesure la performance de la gestion de la demande elle-même. Sans KPI, impossible de savoir si le flux s'améliore.`,"missing-kbi":`Aucun comportement sous contrôle des analystes. Sans KBI, la chaîne constate mais ne donne aucun levier pour agir.`,"missing-leading":`Tous les indicateurs regardent en arrière. Sans indicateur avancé (leading), on pilote dans le rétroviseur.`,"missing-lagging":`Aucun indicateur de résultat. Sans lagging, on suit l'effort sans jamais vérifier qu'il produit quelque chose.`}},validExample:[`kbi-qualification-gabarit`,`kpi-delai-traduction`,`kgi-part-solutions`],quiz:[{id:`lire-tendance-attente`,palier:1,question:`Le délai de traduction d'une demande reste stable, mais le nombre de demandes en attente de qualification a doublé en deux mois. Que lire ?`,options:[{id:`signal-faible`,label:`Un signal faible à surveiller : ça s'accumule avant traitement`,correct:!0,feedback:`Deux cadrans se lisent ensemble : un délai stable qui cache une file d'attente qui grossit annonce un ralentissement à venir.`},{id:`tout-va-bien`,label:`Tout va bien puisque le délai de traduction n'a pas bougé`,correct:!1,feedback:`Un seul cadran ne suffit jamais : la file d'attente qui double annonce mécaniquement des délais plus longs demain.`},{id:`moins-analystes`,label:`Réduire le nombre d'analystes puisqu'ils suivent`,correct:!1,feedback:`C'est l'intuition inverse du flux : réduire la capacité pendant que la file grossit aggrave l'accumulation.`}]},{id:`lire-deux-cadrans-clarification`,palier:1,question:`Le délai de traduction d'une demande a baissé, mais le taux de retour en clarification après découpage a doublé. Que lire ?`,options:[{id:`vite-mais-mal`,label:`Traité plus vite, mais moins bien : à investiguer`,correct:!0,feedback:`Deux cadrans se lisent ensemble : un délai qui s'améliore payé par plus d'allers-retours n'est pas un vrai progrès.`},{id:`progres-net`,label:`Un progrès net, le délai est ce qui compte`,correct:!1,feedback:`Le délai seul ne dit rien de la qualité du découpage : le retour en clarification qui double est le signal à lire.`},{id:`ignorer`,label:`Un détail à ignorer tant que le délai s'améliore`,correct:!1,feedback:`Ignorer ce cadran revient à optimiser la vitesse au prix de la qualité : les deux se lisent ensemble.`}]},{id:`choisir-direction-transverse`,palier:2,question:`U
